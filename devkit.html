<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevKit — Command Reference</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── THEMES ── */
  :root[data-theme="dark"] {
    --bg: #0b0e16;
    --surface: #111520;
    --card: #161b2c;
    --card2: #1c2235;
    --border: #252d4a;
    --border2: #1e263d;
    --accent: #4f8ef7;
    --accent-dim: #2a4a8a;
    --green: #38d9a9;
    --yellow: #f7c948;
    --pink: #f76c8e;
    --purple: #a07cf0;
    --orange: #ff9f6b;
    --cyan: #60c8e8;
    --red: #f76c6c;
    --text: #dce4f5;
    --text2: #8a9bc5;
    --text3: #4a5878;
    --code: #a8c8ff;
    --code-bg: #0d1220;
    --tag-bg: #1a2245;
    --scrollbar: #1e2840;
    --mark-bg: #2a3a1a;
    --mark-text: #8fdf6f;
    --star-active: #f7c948;
  }

  :root[data-theme="light"] {
    --bg: #f6f7fb;
    --surface: #ffffff;
    --card: #ffffff;
    --card2: #f0f3fa;
    --border: #dde3ee;
    --border2: #eaeef5;
    --accent: #2563eb;
    --accent-dim: #c7d7f5;
    --green: #059669;
    --yellow: #d97706;
    --pink: #db2777;
    --purple: #7c3aed;
    --orange: #ea580c;
    --cyan: #0891b2;
    --red: #dc2626;
    --text: #1e293b;
    --text2: #64748b;
    --text3: #94a3b8;
    --code: #1e40af;
    --code-bg: #f1f5fb;
    --tag-bg: #eff4fc;
    --scrollbar: #cdd5e3;
    --mark-bg: #fef3c7;
    --mark-text: #92400e;
    --star-active: #d97706;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: var(--ui-font-size, 13px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.2s, color 0.2s;
  }

  /* ── HEADER ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }

  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 14px;
  }
  .logo-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .logo-text span { color: var(--text3); font-weight: 400; }

  .search-wrap {
    flex: 1;
    position: relative;
    max-width: 480px;
  }
  .search-wrap input {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 36px 9px 36px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 13px;
    pointer-events: none;
  }
  .search-kbd {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text3);
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    padding: 2px 5px;
    border-radius: 3px;
    pointer-events: none;
  }

  .header-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }

  .icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 14px;
    position: relative;
  }
  .icon-btn:hover { background: var(--card2); color: var(--text); border-color: var(--accent-dim); }
  .icon-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .icon-btn .badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--accent);
    color: #fff;
    font-size: 9px;
    font-family: 'JetBrains Mono', monospace;
    padding: 1px 4px;
    border-radius: 8px;
    min-width: 14px;
    text-align: center;
    line-height: 1.2;
  }

  /* ── LAYOUT ── */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }

  .sidebar-section { padding: 10px 0; border-bottom: 1px solid var(--border2); }
  .sidebar-section:last-child { border-bottom: none; }

  .sidebar-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 4px 16px 8px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .sidebar-label .label-text { flex: 1; }
  .sidebar-label .label-actions {
    display: flex;
    gap: 2px;
  }
  .sidebar-label .label-btn {
    background: transparent;
    border: none;
    color: var(--text3);
    font-size: 10px;
    cursor: pointer;
    padding: 2px 5px;
    border-radius: 3px;
    font-family: inherit;
    letter-spacing: normal;
    text-transform: none;
    font-weight: 500;
    transition: all 0.15s;
  }
  .sidebar-label .label-btn:hover {
    background: var(--card2);
    color: var(--text);
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    color: var(--text2);
    user-select: none;
    font-size: 12.5px;
  }
  .nav-item:hover { background: var(--card2); color: var(--text); }
  .nav-item.active {
    background: var(--card2);
    border-left-color: var(--accent);
    color: var(--text);
    font-weight: 600;
  }
  .nav-icon { width: 18px; text-align: center; font-size: 13px; flex-shrink: 0; }
  .nav-label { flex: 1; }
  .nav-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 10px;
    border: 1px solid var(--border2);
  }
  .nav-item.active .nav-count { color: var(--accent); border-color: var(--accent-dim); }

  /* Expandable nav */
  .nav-group { user-select: none; }
  .nav-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    color: var(--text2);
    font-size: 12.5px;
    position: relative;
  }
  .nav-toggle:hover { background: var(--card2); color: var(--text); }
  .nav-toggle.has-active {
    color: var(--text);
    font-weight: 600;
  }
  .nav-toggle.expanded {
    background: var(--card2);
  }
  .nav-toggle .chevron {
    font-size: 9px;
    color: var(--text3);
    transition: transform 0.15s;
    width: 10px;
    text-align: center;
  }
  .nav-toggle.expanded .chevron { transform: rotate(90deg); }
  .nav-sub {
    display: none;
    background: var(--bg);
    border-bottom: 1px solid var(--border2);
  }
  .nav-toggle.expanded + .nav-sub { display: block; }
  .nav-sub-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px 6px 38px;
    cursor: pointer;
    color: var(--text3);
    font-size: 11.5px;
    transition: all 0.1s;
    border-left: 2px solid transparent;
    position: relative;
  }
  .nav-sub-item::before {
    content: '';
    position: absolute;
    left: 26px;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--text3);
    opacity: 0.4;
    transform: translateY(-50%);
  }
  .nav-sub-item:hover {
    background: var(--card2);
    color: var(--text);
  }
  .nav-sub-item:hover::before { opacity: 0.7; }
  .nav-sub-item.active {
    background: var(--card2);
    color: var(--text);
    border-left-color: var(--accent);
    font-weight: 500;
  }
  .nav-sub-item.active::before {
    background: var(--accent);
    opacity: 1;
  }
  .nav-sub-item .sub-label { flex: 1; }
  .nav-sub-item .sub-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--text3);
    background: transparent;
    padding: 0 4px;
    border-radius: 8px;
  }
  .nav-sub-item.active .sub-count {
    color: var(--accent);
  }
  .nav-sub-item .sub-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-left: -3px;
  }
  /* "All sections" item */
  .nav-sub-item.all-sections {
    color: var(--text2);
    font-weight: 500;
    padding-left: 38px;
  }
  .nav-sub-item.all-sections::before { display: none; }

  /* ── MAIN ── */
  .main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 24px 60px;
  }

  .main::-webkit-scrollbar { width: 8px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 4px; }

  /* ── PAGE HEADER ── */
  .page-header {
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border2);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .page-icon {
    width: 38px; height: 38px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .page-title-block { flex: 1; }
  .page-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .page-subtitle {
    font-size: 12px;
    color: var(--text2);
    margin-top: 2px;
  }
  .page-meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }

  /* ── SECTION ── */
  .section { margin-bottom: 14px; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s;
  }
  .section-header:hover { background: var(--card2); }
  .section.collapsed .section-header { border-radius: 8px; }

  .section-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    flex: 1;
    color: var(--text);
  }
  .section-badge {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg);
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border2);
    font-family: 'JetBrains Mono', monospace;
  }
  .section-arrow { color: var(--text3); font-size: 9px; transition: transform 0.2s; }
  .section.collapsed .section-arrow { transform: rotate(-90deg); }

  .cmd-list {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
    background: var(--surface);
  }
  .section.collapsed .cmd-list { display: none; }

  /* ── COMMAND ITEM — base ── */
  .cmd-item {
    padding: 11px 14px;
    border-bottom: 1px solid var(--border2);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    transition: background 0.1s;
    position: relative;
  }
  .cmd-item:last-child { border-bottom: none; }
  .cmd-item:hover { background: var(--card2); }
  .cmd-item:hover .cmd-actions { opacity: 1; }

  .cmd-body { flex: 1; min-width: 0; }

  code {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: calc(var(--ui-font-size, 13px) - 1px);
    color: var(--code);
    background: var(--code-bg);
    padding: 6px 10px;
    border-radius: 5px;
    border: 1px solid var(--border2);
    margin-bottom: 6px;
    word-break: break-all;
    line-height: 1.55;
  }

  .cmd-desc {
    font-size: calc(var(--ui-font-size, 13px) - 1px);
    color: var(--text2);
    line-height: 1.5;
  }

  /* ── VIEW: COMFORTABLE (default) ── */
  body[data-view="comfortable"] .cmd-item {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border2);
  }
  body[data-view="comfortable"] code {
    font-size: calc(var(--ui-font-size, 13px));
    padding: 8px 12px;
    margin-bottom: 7px;
  }
  body[data-view="comfortable"] .cmd-desc {
    font-size: calc(var(--ui-font-size, 13px) - 1px);
  }

  /* ── VIEW: COMPACT ── */
  body[data-view="compact"] .cmd-item {
    padding: 5px 12px;
    align-items: center;
    gap: 8px;
  }
  body[data-view="compact"] .cmd-body {
    display: flex;
    align-items: baseline;
    gap: 10px;
    min-width: 0;
  }
  body[data-view="compact"] code {
    display: inline;
    font-size: calc(var(--ui-font-size, 13px) - 1.5px);
    padding: 2px 7px;
    margin-bottom: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 45%;
    flex-shrink: 0;
    vertical-align: middle;
  }
  body[data-view="compact"] .cmd-desc {
    font-size: calc(var(--ui-font-size, 13px) - 2px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  body[data-view="compact"] .cmd-note { display: none; }
  body[data-view="compact"] .cmd-actions { margin-top: 0; }
  body[data-view="compact"] .section-header { padding: 7px 12px; }

  /* ── VIEW: CARDS ── */
  body[data-view="cards"] .cmd-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 10px;
    padding: 12px;
    background: transparent;
    border: none;
    border-radius: 0;
  }
  body[data-view="cards"] .cmd-item {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    padding: 12px 14px;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  body[data-view="cards"] .cmd-item:hover {
    border-color: var(--accent-dim);
    background: var(--card2);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  body[data-view="cards"] .cmd-body { width: 100%; }
  body[data-view="cards"] code {
    font-size: calc(var(--ui-font-size, 13px) - 0.5px);
    padding: 7px 10px;
  }
  body[data-view="cards"] .cmd-desc {
    font-size: calc(var(--ui-font-size, 13px) - 1px);
  }
  body[data-view="cards"] .cmd-actions {
    opacity: 1;
    width: 100%;
    justify-content: flex-end;
    padding-top: 4px;
    border-top: 1px solid var(--border2);
    margin-top: 2px;
  }
  body[data-view="cards"] .section.collapsed .cmd-list { display: none; }

  /* ── SYNTAX COLORING IN CODE BLOCKS ── */
  .syn-flag  { color: #7eb8f7; }   /* --flags and /switches */
  .syn-str   { color: #b8d490; }   /* quoted strings */
  .syn-path  { color: #e8a87c; }   /* paths and files */
  .syn-op    { color: #f7c948; }   /* operators & pipes */
  .syn-kw    { color: #c792ea; }   /* keywords: SELECT FROM etc */
  .syn-num   { color: #f78c6c; }   /* numbers */
  .syn-base  { color: var(--accent); font-weight: 600; } /* base command */

  /* ── VIEW TOGGLE BUTTONS IN TOOLBAR ── */
  .view-toggle {
    display: flex;
    gap: 2px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
  }
  .view-btn {
    background: transparent;
    border: none;
    color: var(--text3);
    width: 26px;
    height: 26px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    title: attr(title);
  }
  .view-btn:hover { background: var(--card); color: var(--text); }
  .view-btn.active { background: var(--accent); color: #fff; }

  /* ── FONT SIZE SLIDER ── */
  .font-slider-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0 2px;
  }
  .font-slider-wrap span {
    font-size: 10px;
    color: var(--text3);
    min-width: 24px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
  .font-slider-wrap input[type=range] {
    -webkit-appearance: none;
    width: 70px;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .font-slider-wrap input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  /* ── SIDEBAR RESIZE ── */
  .sidebar-resizer {
    width: 4px;
    background: transparent;
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
    position: relative;
    z-index: 10;
  }
  .sidebar-resizer:hover,
  .sidebar-resizer.dragging { background: var(--accent); }

  .cmd-note {
    margin-top: 6px;
    padding: 6px 9px;
    background: var(--tag-bg);
    border-left: 2px solid var(--accent);
    border-radius: 3px;
    font-size: 11px;
    color: var(--text2);
    line-height: 1.5;
    font-style: italic;
  }
  .cmd-note::before { content: "📝 "; font-style: normal; }

  .cmd-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.15s;
    margin-top: 2px;
  }
  .cmd-item.has-note .cmd-actions,
  .cmd-item.is-favorite .cmd-actions { opacity: 0.6; }
  .cmd-item.has-note:hover .cmd-actions,
  .cmd-item.is-favorite:hover .cmd-actions { opacity: 1; }

  .mini-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text3);
    width: 28px;
    height: 28px;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-size: 12px;
  }
  .mini-btn:hover { background: var(--card); color: var(--text); border-color: var(--accent-dim); }
  .mini-btn.star.active { color: var(--star-active); border-color: var(--star-active); }
  .mini-btn.note.active { color: var(--accent); border-color: var(--accent); }
  .mini-btn.copy {
    background: var(--tag-bg);
    color: var(--accent);
    border-color: var(--accent-dim);
    font-size: 10px;
    width: auto;
    padding: 0 10px;
    font-weight: 600;
  }
  .mini-btn.copy:hover { background: var(--accent); color: #fff; }
  .mini-btn.copy.ok { background: var(--green); color: #fff; border-color: var(--green); }

  /* ── BUILDER PAGE ── */
  .builder-page-search {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px 10px 36px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    outline: none;
    margin-bottom: 20px;
    transition: border-color 0.2s;
  }
  .builder-page-search:focus { border-color: var(--accent); }
  .builder-page-search-wrap { position: relative; }
  .builder-page-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; margin-top: -10px; }

  .builder-group { margin-bottom: 28px; }
  .builder-group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border2);
  }
  .builder-group-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    flex-shrink: 0;
  }
  .builder-group-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .builder-group-count {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg);
    border: 1px solid var(--border2);
    padding: 2px 7px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    margin-left: auto;
  }

  .builder-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }
  .builder-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 14px 16px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .builder-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--card-accent, var(--accent));
    border-radius: 9px 0 0 9px;
  }
  .builder-card:hover {
    background: var(--card2);
    border-color: var(--accent-dim);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  }
  .builder-card-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .builder-card-desc {
    font-size: 11.5px;
    color: var(--text2);
    line-height: 1.4;
  }
  .builder-card-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 2px;
  }
  .builder-card-flags {
    font-size: 10px;
    color: var(--text3);
    background: var(--bg);
    border: 1px solid var(--border2);
    padding: 2px 7px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .builder-card-open {
    margin-left: auto;
    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .builder-card:hover .builder-card-open { opacity: 1; }

  /* ── EMPTY ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }
  .empty p { font-size: 13px; line-height: 1.6; }
  .empty p strong { color: var(--text2); }

  /* ── NOTE EDITOR MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 500px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .modal-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 4px;
    color: var(--text);
  }
  .modal-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 14px;
    word-break: break-all;
    padding: 6px 9px;
    background: var(--code-bg);
    border-radius: 4px;
    border: 1px solid var(--border2);
  }
  .modal textarea {
    width: 100%;
    min-height: 100px;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    outline: none;
    resize: vertical;
    line-height: 1.5;
  }
  .modal textarea:focus { border-color: var(--accent); }
  .modal-actions {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    justify-content: flex-end;
  }
  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--card2);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover { background: var(--card); border-color: var(--accent-dim); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { background: var(--accent); opacity: 0.9; }
  .btn.danger { color: var(--red); border-color: var(--red); background: transparent; }
  .btn.danger:hover { background: var(--red); color: #fff; }

  /* ── COMMAND BUILDER ── */
  .builder-modal { max-width: 720px; max-height: 85vh; display: flex; flex-direction: column; }
  .builder-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .builder-icon {
    width: 28px; height: 28px;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }
  .builder-title-block { flex: 1; }
  .builder-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .builder-sub { font-size: 11px; color: var(--text2); margin-top: 1px; }

  .builder-preview {
    background: var(--code-bg);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 12px 0;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--code);
    word-break: break-all;
    line-height: 1.6;
    min-height: 42px;
    position: relative;
  }
  .builder-preview-label {
    position: absolute;
    top: -7px; left: 10px;
    background: var(--surface);
    color: var(--text3);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 9px;
    font-weight: 600;
    padding: 0 6px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .builder-token { display: inline; }
  .builder-token.required { color: var(--code); }
  .builder-token.placeholder {
    color: var(--text3);
    background: rgba(255,200,100,0.08);
    padding: 0 3px;
    border-radius: 2px;
    border-bottom: 1px dashed var(--text3);
  }
  .builder-token.flag { color: var(--accent); }
  .builder-token.value { color: #b8d490; }

  .builder-body {
    flex: 1;
    overflow-y: auto;
    margin: 0 -4px;
    padding: 0 4px;
  }
  .builder-body::-webkit-scrollbar { width: 6px; }
  .builder-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

  .builder-section {
    margin-bottom: 14px;
  }
  .builder-section-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .builder-section-title::before {
    content: '';
    width: 2px;
    height: 11px;
    background: var(--accent);
    border-radius: 1px;
  }
  .builder-section-title.required-section::before { background: var(--red); }

  /* Required input fields */
  .builder-input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--card2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .builder-input-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    min-width: 90px;
    flex-shrink: 0;
  }
  .builder-input-row input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    outline: none;
  }
  .builder-input-row input[type="text"]:focus { border-color: var(--accent); }
  .builder-input-hint {
    font-size: 10px;
    color: var(--text3);
    flex-shrink: 0;
  }

  /* Flag options */
  .builder-flag {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--border2);
    border-radius: 6px;
    margin-bottom: 5px;
    cursor: pointer;
    background: var(--surface);
    transition: all 0.1s;
  }
  .builder-flag:hover {
    background: var(--card2);
    border-color: var(--border);
  }
  .builder-flag.checked {
    background: var(--tag-bg);
    border-color: var(--accent-dim);
  }
  .builder-flag input[type="checkbox"] {
    margin-top: 2px;
    cursor: pointer;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .builder-flag-body { flex: 1; min-width: 0; }
  .builder-flag-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--code);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .builder-flag.checked .builder-flag-name { color: var(--accent); }
  .builder-flag-desc {
    font-size: 11px;
    color: var(--text2);
    line-height: 1.4;
  }
  .builder-flag-value-input {
    margin-top: 6px;
    display: none;
  }
  .builder-flag.checked .builder-flag-value-input { display: block; }
  .builder-flag-value-input input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    outline: none;
  }
  .builder-flag-value-input input:focus { border-color: var(--accent); }
  .builder-flag-value-input label {
    font-size: 10px;
    color: var(--text3);
    margin-bottom: 3px;
    display: block;
  }

  /* Builder button on command items */
  .mini-btn.build {
    background: linear-gradient(135deg, var(--accent), var(--purple));
    color: #fff;
    border-color: transparent;
    font-size: 10px;
    width: auto;
    padding: 0 10px;
    font-weight: 600;
  }
  .mini-btn.build:hover { opacity: 0.9; }

  /* Has-builder indicator */
  .cmd-item.has-builder code::after {
    content: '⚙ builder';
    margin-left: 8px;
    font-size: 9px;
    color: var(--accent);
    background: var(--tag-bg);
    padding: 1px 6px;
    border-radius: 3px;
    border: 1px solid var(--accent-dim);
    vertical-align: middle;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
  }

  /* ── HISTORY PANEL ── */
  .panel {
    position: fixed;
    top: 0;
    right: -380px;
    width: 360px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    z-index: 90;
    transition: right 0.25s ease;
    display: flex;
    flex-direction: column;
    box-shadow: -10px 0 30px rgba(0,0,0,0.15);
  }
  .panel.open { right: 0; }
  .panel-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 700;
    flex: 1;
  }
  .panel-clear {
    font-size: 11px;
    color: var(--red);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
  }
  .panel-clear:hover { background: var(--card2); }
  .panel-close {
    background: transparent;
    border: none;
    color: var(--text3);
    cursor: pointer;
    font-size: 18px;
    width: 26px;
    height: 26px;
    border-radius: 4px;
  }
  .panel-close:hover { background: var(--card2); color: var(--text); }
  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .panel-body::-webkit-scrollbar { width: 5px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
  .history-item {
    padding: 9px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.1s;
    border: 1px solid transparent;
  }
  .history-item:hover { background: var(--card2); border-color: var(--border2); }
  .history-cmd {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--code);
    word-break: break-all;
    line-height: 1.4;
    margin-bottom: 3px;
  }
  .history-meta {
    font-size: 10px;
    color: var(--text3);
    display: flex;
    gap: 8px;
  }
  .history-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
    font-size: 12px;
  }

  /* Builder picker */
  .picker-group-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 10px 10px 5px;
  }
  .picker-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.1s;
    margin-bottom: 3px;
  }
  .picker-item:hover { background: var(--card2); border-color: var(--border2); }
  .picker-item-icon {
    width: 30px; height: 30px;
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    flex-shrink: 0;
  }
  .picker-item-body { flex: 1; min-width: 0; }
  .picker-item-name {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 2px;
  }
  .picker-item-desc {
    font-size: 10.5px;
    color: var(--text2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .picker-item-count {
    font-size: 9px;
    color: var(--text3);
    background: var(--tag-bg);
    padding: 2px 6px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  /* ── STATUS BAR ── */
  .statusbar {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-shrink: 0;
    font-size: 10px;
  }
  .status-item { display: flex; align-items: center; gap: 5px; color: var(--text3); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .status-spacer { flex: 1; }
  .status-kbd {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text3);
  }
  .status-kbd kbd {
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 1px 4px;
    font-size: 9px;
    color: var(--text2);
    margin: 0 1px;
  }

  /* highlight */
  mark {
    background: var(--mark-bg);
    color: var(--mark-text);
    border-radius: 2px;
    padding: 0 2px;
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .sidebar { width: 64px; }
    .nav-label, .nav-count, .sidebar-label, .chevron { display: none; }
    .nav-icon { font-size: 16px; width: 100%; }
    .nav-toggle { justify-content: center; padding: 10px 0; }
    .nav-sub { display: none !important; }
    .panel { width: 100%; right: -100%; }
    .header { padding: 10px 12px; gap: 8px; }
    .logo-text { display: none; }
    .main { padding: 14px 14px 60px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="logo-wrap">
    <div class="logo-icon">⌘</div>
    <div class="logo-text">DevKit <span>/ commands</span></div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search commands across all sheets..." autocomplete="off" spellcheck="false">
    <span class="search-kbd">⌘K</span>
  </div>

  <div class="header-actions">
    <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">
      <span id="theme-icon">🌙</span>
    </button>
    <button class="icon-btn" id="history-btn" onclick="togglePanel('history')" title="Copy history">
      📋
      <span class="badge" id="history-badge" style="display:none">0</span>
    </button>

    <!-- Font size slider -->
    <div class="font-slider-wrap" title="Font size">
      <span style="font-size:9px">A</span>
      <input type="range" id="font-slider" min="11" max="17" step="1" value="13"
        oninput="setFontSize(this.value)" title="Adjust font size">
      <span style="font-size:13px">A</span>
    </div>

    <!-- View toggle -->
    <div class="view-toggle">
      <button class="view-btn" id="view-comfortable" onclick="setView('comfortable')" title="Comfortable view">☰</button>
      <button class="view-btn" id="view-compact"     onclick="setView('compact')"     title="Compact view">≡</button>
      <button class="view-btn" id="view-cards"       onclick="setView('cards')"       title="Card grid view">⊞</button>
    </div>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar"></div>
  <div class="sidebar-resizer" id="sidebar-resizer"></div>

  <!-- MAIN CONTENT -->
  <div class="main" id="main"></div>

</div>

<!-- STATUS BAR -->
<div class="statusbar">
  <div class="status-item">
    <div class="status-dot"></div>
    <span id="status-name">DevKit</span>
  </div>
  <div class="status-item" id="status-counts">0 commands</div>
  <div class="status-spacer"></div>
  <div class="status-kbd"><kbd>⌘K</kbd> search · <kbd>⚙</kbd> builder · <kbd>Esc</kbd> close · <kbd>⌘B</kbd> sidebar</div>
</div>

<!-- NOTE EDITOR MODAL -->
<div class="modal-overlay" id="note-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">Personal Note</div>
    <div class="modal-sub" id="note-modal-cmd"></div>
    <textarea id="note-modal-text" placeholder="Add your notes about this command — context, gotchas, examples..."></textarea>
    <div class="modal-actions">
      <button class="btn danger" onclick="deleteNote()">Delete</button>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="saveNote()">Save</button>
    </div>
  </div>
</div>

<!-- COMMAND BUILDER MODAL -->
<div class="modal-overlay" id="builder-modal" onclick="if(event.target===this)closeBuilder()">
  <div class="modal builder-modal">
    <div class="builder-header">
      <div class="builder-icon">⚙</div>
      <div class="builder-title-block">
        <div class="builder-title" id="builder-title">Command Builder</div>
        <div class="builder-sub" id="builder-sub">Pick the options you need</div>
      </div>
    </div>
    <div class="builder-preview">
      <span class="builder-preview-label">Preview</span>
      <span id="builder-preview-text"></span>
    </div>
    <div class="builder-body" id="builder-body"></div>
    <div class="modal-actions">
      <button class="btn" onclick="resetBuilder()">Reset</button>
      <button class="btn" onclick="closeBuilder()">Cancel</button>
      <button class="btn primary" onclick="copyBuiltCommand()">Copy command</button>
    </div>
  </div>
</div>

<!-- HISTORY PANEL -->
<div class="panel" id="history-panel">
  <div class="panel-header">
    <div class="panel-title">Copy History</div>
    <button class="panel-clear" onclick="clearHistory()">Clear all</button>
    <button class="panel-close" onclick="togglePanel('history')">✕</button>
  </div>
  <div class="panel-body" id="history-body"></div>
</div>

<script>
/* ─────────────────────────────────────────
   STATE & STORAGE
───────────────────────────────────────── */
const STORAGE_KEYS = {
  theme: 'devkit:theme',
  favorites: 'devkit:favorites',
  notes: 'devkit:notes',
  history: 'devkit:history',
  activeSheet: 'devkit:activeSheet',
  expandedSheets: 'devkit:expandedSheets',
  activeSection: 'devkit:activeSection',
  viewMode: 'devkit:viewMode',
  fontSize: 'devkit:fontSize',
  sidebarWidth: 'devkit:sidebarWidth',
};

const state = {
  theme: localStorage.getItem(STORAGE_KEYS.theme) || 'dark',
  favorites: new Set(JSON.parse(localStorage.getItem(STORAGE_KEYS.favorites) || '[]')),
  notes: JSON.parse(localStorage.getItem(STORAGE_KEYS.notes) || '{}'),
  history: JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]'),
  activeSheet: localStorage.getItem(STORAGE_KEYS.activeSheet) || 'gam7',
  expandedSheets: new Set(JSON.parse(localStorage.getItem(STORAGE_KEYS.expandedSheets) || '[]')),
  activeSection: localStorage.getItem(STORAGE_KEYS.activeSection) || null,
  viewMode: localStorage.getItem(STORAGE_KEYS.viewMode) || 'comfortable',
  fontSize: parseInt(localStorage.getItem(STORAGE_KEYS.fontSize) || '13', 10),
  sidebarWidth: parseInt(localStorage.getItem(STORAGE_KEYS.sidebarWidth) || '220', 10),
  searchQuery: '',
  currentNoteId: null,
};

function save(key) {
  if (key === 'theme') localStorage.setItem(STORAGE_KEYS.theme, state.theme);
  if (key === 'favorites') localStorage.setItem(STORAGE_KEYS.favorites, JSON.stringify([...state.favorites]));
  if (key === 'notes') localStorage.setItem(STORAGE_KEYS.notes, JSON.stringify(state.notes));
  if (key === 'history') localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(state.history));
  if (key === 'activeSheet') localStorage.setItem(STORAGE_KEYS.activeSheet, state.activeSheet);
  if (key === 'expandedSheets') localStorage.setItem(STORAGE_KEYS.expandedSheets, JSON.stringify([...state.expandedSheets]));
  if (key === 'activeSection') localStorage.setItem(STORAGE_KEYS.activeSection, state.activeSection || '');
  if (key === 'viewMode') localStorage.setItem(STORAGE_KEYS.viewMode, state.viewMode);
  if (key === 'fontSize') localStorage.setItem(STORAGE_KEYS.fontSize, state.fontSize);
  if (key === 'sidebarWidth') localStorage.setItem(STORAGE_KEYS.sidebarWidth, state.sidebarWidth);
}

/* ─────────────────────────────────────────
   RENDER LOGIC
───────────────────────────────────────── */

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-icon').textContent = state.theme === 'dark' ? '🌙' : '☀️';
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  save('theme');
  applyTheme();
}

function highlight(text, q) {
  if (!q) return escapeHTML(text);
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escapeHTML(text).replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function escapeHTML(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function cmdId(sheetKey, cmd) {
  // Create a stable ID for a command across sessions
  return `${sheetKey}::${cmd}`;
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';

  // Special pages section
  const builderCount = Object.keys(BUILDERS).length;
  html += '<div class="sidebar-section">';
  html += '<div class="sidebar-label">Special</div>';
  html += `<div class="nav-item ${state.activeSheet === '__favorites' ? 'active' : ''}" onclick="setSheet('__favorites', null, this)">
    <span class="nav-icon">⭐</span>
    <span class="nav-label">Favorites</span>
    <span class="nav-count">${state.favorites.size}</span>
  </div>`;
  html += `<div class="nav-item ${state.activeSheet === '__builder' ? 'active' : ''}" onclick="setSheet('__builder', null, this)">
    <span class="nav-icon">⚙</span>
    <span class="nav-label">Command Builder</span>
    <span class="nav-count">${builderCount}</span>
  </div>`;
  html += '</div>';

  // Cheatsheets section — now expandable
  html += '<div class="sidebar-section">';
  html += `<div class="sidebar-label">
    <span class="label-text">Cheatsheets</span>
    <span class="label-actions">
      <button class="label-btn" onclick="expandAllSheets(event)" title="Expand all">＋</button>
      <button class="label-btn" onclick="collapseAllSheets(event)" title="Collapse all">−</button>
    </span>
  </div>`;

  for (const [key, sheet] of Object.entries(SHEETS)) {
    const cmdCount = sheet.sections.reduce((sum, s) => sum + s.cmds.length, 0);
    const isActive = state.activeSheet === key;
    const isExpanded = state.expandedSheets.has(key);

    html += `<div class="nav-group">
      <div class="nav-toggle ${isActive ? 'has-active' : ''} ${isExpanded ? 'expanded' : ''}" onclick="toggleSheetExpand('${key}', event)">
        <span class="chevron">▶</span>
        <span class="nav-icon">${sheet.icon}</span>
        <span class="nav-label">${sheet.name}</span>
        <span class="nav-count">${cmdCount}</span>
      </div>
      <div class="nav-sub">
        <div class="nav-sub-item all-sections ${isActive && !state.activeSection ? 'active' : ''}" onclick="setSheet('${key}', null, this)">
          <span class="sub-label">All sections</span>
          <span class="sub-count">${cmdCount}</span>
        </div>`;

    sheet.sections.forEach(section => {
      const secActive = isActive && state.activeSection === section.id;
      html += `<div class="nav-sub-item ${secActive ? 'active' : ''}" onclick="setSheet('${key}', '${section.id}', this)">
        <span class="sub-dot" style="background:${section.color}"></span>
        <span class="sub-label">${section.title}</span>
        <span class="sub-count">${section.cmds.length}</span>
      </div>`;
    });

    html += `</div>
    </div>`;
  }
  html += '</div>';

  sb.innerHTML = html;
}

function toggleSheetExpand(key, event) {
  event.stopPropagation();
  if (state.expandedSheets.has(key)) {
    state.expandedSheets.delete(key);
  } else {
    state.expandedSheets.add(key);
  }
  save('expandedSheets');
  renderSidebar();
}

function expandAllSheets(event) {
  if (event) event.stopPropagation();
  Object.keys(SHEETS).forEach(key => state.expandedSheets.add(key));
  save('expandedSheets');
  renderSidebar();
}

function collapseAllSheets(event) {
  if (event) event.stopPropagation();
  state.expandedSheets.clear();
  save('expandedSheets');
  renderSidebar();
}

function setSheet(key, sectionId, navElement) {
  const isSameSheet = state.activeSheet === key && state.activeSection === sectionId;

  // Double-click on active item scrolls to top
  if (isSameSheet) {
    const main = document.getElementById('main');
    main.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  state.activeSheet = key;
  state.activeSection = sectionId || null;
  state.searchQuery = '';
  document.getElementById('search').value = '';

  // Expand the sheet if not already expanded (only for real sheets)
  const specialPages = ['__favorites', '__builder'];
  if (!specialPages.includes(key) && !state.expandedSheets.has(key)) {
    state.expandedSheets.add(key);
    save('expandedSheets');
  }

  save('activeSheet');
  save('activeSection');
  renderSidebar();
  renderMain();

  // Scroll main to top when changing sheet/section
  document.getElementById('main').scrollTop = 0;
}

function renderMain() {
  const main = document.getElementById('main');
  const q = state.searchQuery.toLowerCase();

  if (state.activeSheet === '__favorites') {
    renderFavorites(q);
  } else if (state.activeSheet === '__builder') {
    renderBuilderPage(q);
  } else {
    renderSheet(state.activeSheet, q);
  }
}

function renderSheet(key, q) {
  const sheet = SHEETS[key];
  if (!sheet) return;

  // Filter to a single section if one is active
  const sectionsToShow = state.activeSection
    ? sheet.sections.filter(s => s.id === state.activeSection)
    : sheet.sections;

  const activeSec = state.activeSection ? sheet.sections.find(s => s.id === state.activeSection) : null;
  const subtitleText = activeSec ? `${sheet.name} · ${activeSec.title}` : sheet.subtitle;

  const main = document.getElementById('main');
  let html = `
    <div class="page-header">
      <div class="page-icon" style="background:${sheet.iconBg}20;color:${sheet.iconBg};border:1px solid ${sheet.iconBg}40">${sheet.icon}</div>
      <div class="page-title-block">
        <div class="page-title">${activeSec ? activeSec.title : sheet.name}</div>
        <div class="page-subtitle">${subtitleText}</div>
      </div>
      <div class="page-meta">${sheet.meta}</div>
    </div>
  `;

  let totalVisible = 0;
  let sectionsHtml = '';

  sectionsToShow.forEach(section => {
    const filteredCmds = section.cmds.filter(c => {
      if (!q) return true;
      return c.cmd.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || section.title.toLowerCase().includes(q);
    });

    if (!filteredCmds.length) return;
    totalVisible += filteredCmds.length;

    sectionsHtml += renderSectionHTML(key, section, filteredCmds, q);
  });

  if (totalVisible === 0) {
    sectionsHtml = `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <p><strong>No commands match your search.</strong><br>Try different keywords or clear the search.</p>
      </div>
    `;
  }

  html += sectionsHtml;
  main.innerHTML = html;
  updateStatusCount(totalVisible, sheet.name);
}

function renderSectionHTML(sheetKey, section, cmds, q) {
  let html = `<div class="section" id="section-${section.id}">
    <div class="section-header" onclick="toggleSection('${section.id}')">
      <div class="section-dot" style="background:${section.color}"></div>
      <div class="section-title">${section.title}</div>
      <div class="section-badge">${cmds.length}</div>
      <div class="section-arrow">▼</div>
    </div>
    <div class="cmd-list">`;

  cmds.forEach(c => {
    const id = cmdId(sheetKey, c.cmd);
    const isFav = state.favorites.has(id);
    const note = state.notes[id];
    const hasNote = note && note.trim().length > 0;
    const builderKey = (c._sheetKey || sheetKey) + '::' + c.cmd;
    const hasBuilder = BUILDERS[builderKey] !== undefined;

    const classes = ['cmd-item'];
    if (isFav) classes.push('is-favorite');
    if (hasNote) classes.push('has-note');
    if (hasBuilder) classes.push('has-builder');

    html += `
      <div class="${classes.join(' ')}" data-id="${escapeHTML(id)}">
        <div class="cmd-body">
          <code>${q ? highlight(c.cmd, q) : syntaxHighlight(c.cmd)}</code>
          <div class="cmd-desc">${highlight(c.desc, q)}</div>
          ${hasNote ? `<div class="cmd-note">${escapeHTML(note)}</div>` : ''}
        </div>
        <div class="cmd-actions">
          <button class="mini-btn star ${isFav ? 'active' : ''}" onclick="toggleFavorite('${escapeAttr(id)}')" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">★</button>
          <button class="mini-btn note ${hasNote ? 'active' : ''}" onclick="openNote('${escapeAttr(id)}', this)" title="Edit note">✎</button>
          <button class="mini-btn copy" onclick="copyCmd(this, '${escapeAttr(c.cmd)}')" title="Copy command">Copy</button>
        </div>
      </div>
    `;
  });

  html += '</div></div>';
  return html;
}

function escapeAttr(s) {
  return s.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
}

function renderBuilderPage(q) {
  const main = document.getElementById('main');

  // First visit: render the static shell (header + search box + results container)
  // Subsequent calls from search: only update the results container
  if (!document.getElementById('builder-results')) {
    main.innerHTML = `
      <div class="page-header">
        <div class="page-icon" style="background:#4f8ef720;color:var(--accent);border:1px solid var(--accent-dim)">⚙</div>
        <div class="page-title-block">
          <div class="page-title">Command Builder</div>
          <div class="page-subtitle">Build complex commands interactively — pick flags, set values, copy the result</div>
        </div>
        <div class="page-meta" id="builder-result-count"></div>
      </div>
      <div class="builder-page-search-wrap" style="position:relative;margin-bottom:20px">
        <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none">🔍</span>
        <input id="builder-page-input" class="builder-page-search"
          placeholder="Search builders by command or tool..."
          style="padding-left:36px" autocomplete="off" spellcheck="false">
      </div>
      <div id="builder-results"></div>
    `;

    // Attach the input listener once — update only the results, never recreate the input
    const input = document.getElementById('builder-page-input');
    input.addEventListener('input', function() {
      renderBuilderResults(this.value.toLowerCase().trim());
    });
    input.focus();
  }

  // Render results (called on first load and on every keystroke)
  renderBuilderResults(q);
}

function renderBuilderResults(q) {
  const container = document.getElementById('builder-results');
  const countEl   = document.getElementById('builder-result-count');
  if (!container) return;

  // Group builders by sheet, filtered by q
  const grouped = {};
  Object.entries(BUILDERS).forEach(([key, def]) => {
    const sheetKey = key.split('::')[0];
    const sheet = SHEETS[sheetKey];
    if (!sheet) return;
    const matchesQ = !q ||
      def.name.toLowerCase().includes(q) ||
      def.description.toLowerCase().includes(q) ||
      sheet.name.toLowerCase().includes(q);
    if (!matchesQ) return;
    if (!grouped[sheetKey]) grouped[sheetKey] = { sheet, items: [] };
    grouped[sheetKey].items.push({ key, def });
  });

  const totalVisible = Object.values(grouped).reduce((a, g) => a + g.items.length, 0);
  if (countEl) countEl.textContent = totalVisible + ' builders';
  updateStatusCount(totalVisible, 'Command Builder');

  if (totalVisible === 0) {
    container.innerHTML = `<div class="empty"><div class="empty-icon">⚙</div><p><strong>No builders match your search.</strong></p></div>`;
    return;
  }

  let html = '';
  Object.entries(grouped).forEach(([sheetKey, group]) => {
    const { sheet, items } = group;
    html += `
      <div class="builder-group">
        <div class="builder-group-header">
          <div class="builder-group-icon" style="background:${sheet.iconBg}22;color:${sheet.iconBg};border:1px solid ${sheet.iconBg}44">${sheet.icon}</div>
          <span class="builder-group-name">${sheet.name}</span>
          <span class="builder-group-count">${items.length}</span>
        </div>
        <div class="builder-cards">`;

    items.forEach(({ key, def }) => {
      const flagCount = (def.flags || []).filter(f => !f.hidden).length;
      const argCount  = (def.args  || []).filter(a => a.required !== false).length;
      html += `
        <div class="builder-card" style="--card-accent:${sheet.iconBg}" onclick="openBuilder('${escapeAttr(key)}')">
          <div class="builder-card-name">${escapeHTML(def.name)}</div>
          <div class="builder-card-desc">${escapeHTML(def.description)}</div>
          <div class="builder-card-meta">
            ${flagCount ? `<span class="builder-card-flags">⚑ ${flagCount} flags</span>` : ''}
            ${argCount  ? `<span class="builder-card-flags">◈ ${argCount} inputs</span>` : ''}
            <span class="builder-card-open">Open →</span>
          </div>
        </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function renderFavorites(q) {
  const main = document.getElementById('main');
  let html = `
    <div class="page-header">
      <div class="page-icon" style="background:#f7c94820;color:#f7c948;border:1px solid #f7c94840">⭐</div>
      <div class="page-title-block">
        <div class="page-title">Favorites</div>
        <div class="page-subtitle">Your starred commands across all sheets</div>
      </div>
      <div class="page-meta">${state.favorites.size} pinned</div>
    </div>
  `;

  if (state.favorites.size === 0) {
    html += `
      <div class="empty">
        <div class="empty-icon">⭐</div>
        <p><strong>No favorites yet.</strong><br>Click the star icon on any command to pin it here.</p>
      </div>
    `;
    main.innerHTML = html;
    updateStatusCount(0, 'Favorites');
    return;
  }

  // Group favorites by sheet
  const grouped = {};
  for (const favId of state.favorites) {
    const [sheetKey, ...cmdParts] = favId.split('::');
    const cmd = cmdParts.join('::');
    if (!SHEETS[sheetKey]) continue;

    // Find the command and its section
    let found = null;
    for (const section of SHEETS[sheetKey].sections) {
      const c = section.cmds.find(c => c.cmd === cmd);
      if (c) {
        found = { sheet: SHEETS[sheetKey], section, cmd: c };
        break;
      }
    }
    if (!found) continue;

    if (q && !found.cmd.cmd.toLowerCase().includes(q) && !found.cmd.desc.toLowerCase().includes(q)) continue;

    if (!grouped[sheetKey]) grouped[sheetKey] = { sheet: found.sheet, cmds: [] };
    grouped[sheetKey].cmds.push({ ...found.cmd, _section: found.section, _sheetKey: sheetKey });
  }

  let total = 0;
  for (const [sheetKey, group] of Object.entries(grouped)) {
    total += group.cmds.length;
    html += renderSectionHTML(sheetKey, {
      id: `fav-${sheetKey}`,
      title: `${group.sheet.name} · ${group.cmds.length}`,
      color: group.sheet.iconBg,
    }, group.cmds, q);
  }

  if (total === 0) {
    html += `
      <div class="empty">
        <div class="empty-icon">🔍</div>
        <p><strong>No favorites match your search.</strong></p>
      </div>
    `;
  }

  main.innerHTML = html;
  updateStatusCount(total, 'Favorites');
}

function updateStatusCount(count, name) {
  document.getElementById('status-name').textContent = name;
  document.getElementById('status-counts').textContent = `${count} command${count === 1 ? '' : 's'}`;
}

function toggleSection(id) {
  const el = document.getElementById('section-' + id);
  if (el) el.classList.toggle('collapsed');
}

───────────────────────────────────────── */
function toggleFavorite(id) {
  if (state.favorites.has(id)) {
    state.favorites.delete(id);
  } else {
    state.favorites.add(id);
  }
  save('favorites');
  renderSidebar();
  renderMain();
}


/* ─────────────────────────────────────────
   NOTES
───────────────────────────────────────── */
function openNote(id) {
  state.currentNoteId = id;
  const [sheetKey, ...cmdParts] = id.split('::');
  const cmd = cmdParts.join('::');
  document.getElementById('note-modal-cmd').textContent = cmd;
  document.getElementById('note-modal-text').value = state.notes[id] || '';
  document.getElementById('note-modal').classList.add('open');
  setTimeout(() => document.getElementById('note-modal-text').focus(), 50);
}

function closeModal() {
  document.getElementById('note-modal').classList.remove('open');
  state.currentNoteId = null;
}

function saveNote() {
  const text = document.getElementById('note-modal-text').value.trim();
  if (text) {
    state.notes[state.currentNoteId] = text;
  } else {
    delete state.notes[state.currentNoteId];
  }
  save('notes');
  closeModal();
  renderMain();
}

function deleteNote() {
  delete state.notes[state.currentNoteId];
  save('notes');
  closeModal();
  renderMain();
}

/* ─────────────────────────────────────────
   COMMAND BUILDER
───────────────────────────────────────── */
let currentBuilder = null;

function openBuilder(builderKey) {
  const def = BUILDERS[builderKey];
  if (!def) return;
  currentBuilder = { def, values: {}, flags: {}, flagValues: {} };

  // Set defaults
  (def.args || []).forEach(a => {
    currentBuilder.values[a.key] = a.default || '';
  });
  (def.flags || []).forEach(f => {
    currentBuilder.flags[f.flag] = f.alwaysOn || false;
    if (f.valueDefault) currentBuilder.flagValues[f.flag] = f.valueDefault;
  });

  document.getElementById('builder-title').textContent = def.name;
  document.getElementById('builder-sub').textContent = def.description;
  renderBuilderBody(def);
  updateBuilderPreview();
  document.getElementById('builder-modal').classList.add('open');
}

function closeBuilder() {
  document.getElementById('builder-modal').classList.remove('open');
  currentBuilder = null;
}

function resetBuilder() {
  if (!currentBuilder) return;
  const def = currentBuilder.def;
  currentBuilder.values = {};
  currentBuilder.flags = {};
  currentBuilder.flagValues = {};
  (def.args || []).forEach(a => { currentBuilder.values[a.key] = a.default || ''; });
  (def.flags || []).forEach(f => {
    currentBuilder.flags[f.flag] = f.alwaysOn || false;
    if (f.valueDefault) currentBuilder.flagValues[f.flag] = f.valueDefault;
  });
  renderBuilderBody(def);
  updateBuilderPreview();
}

function renderBuilderBody(def) {
  const body = document.getElementById('builder-body');
  let html = '';

  // Required args section
  const reqArgs = (def.args || []).filter(a => a.required !== false);
  if (reqArgs.length) {
    html += `<div class="builder-section">
      <div class="builder-section-title required-section">Required fields</div>`;
    (def.args || []).forEach(a => {
      const val = currentBuilder.values[a.key] || '';
      if (a.type === 'select') {
        html += `<div class="builder-input-row">
          <span class="builder-input-label">${a.label}</span>
          <select onchange="builderArgChange('${escapeAttr(a.key)}', this.value)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px 8px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11.5px;outline:none;">
            ${(a.options || []).map(o => `<option value="${escapeHTML(o.value)}" ${val === o.value ? 'selected' : ''}>${escapeHTML(o.label)}</option>`).join('')}
          </select>
        </div>`;
      } else {
        html += `<div class="builder-input-row">
          <span class="builder-input-label">${a.label}${a.required ? ' *' : ''}</span>
          <input type="text" placeholder="${escapeHTML(a.placeholder || '')}"
            value="${escapeHTML(val)}"
            oninput="builderArgChange('${escapeAttr(a.key)}', this.value)"
          />
          ${a.required ? '' : '<span class="builder-input-hint">optional</span>'}
        </div>`;
      }
    });
    html += `</div>`;
  }

  // Optional args section
  const optArgs = (def.args || []).filter(a => a.required === false);
  if (optArgs.length) {
    html += `<div class="builder-section">
      <div class="builder-section-title">Optional arguments</div>`;
    optArgs.forEach(a => {
      const val = currentBuilder.values[a.key] || '';
      html += `<div class="builder-input-row">
        <span class="builder-input-label">${a.label}</span>
        <input type="text" placeholder="${escapeHTML(a.placeholder || '')}"
          value="${escapeHTML(val)}"
          oninput="builderArgChange('${escapeAttr(a.key)}', this.value)"
        />
        <span class="builder-input-hint">optional</span>
      </div>`;
    });
    html += `</div>`;
  }

  // Flags section
  const visibleFlags = (def.flags || []).filter(f => !f.hidden);
  if (visibleFlags.length) {
    html += `<div class="builder-section">
      <div class="builder-section-title">Options & flags</div>`;
    visibleFlags.forEach(f => {
      const checked = currentBuilder.flags[f.flag] || false;
      const fval = currentBuilder.flagValues[f.flag] || f.valueDefault || '';
      const esc = escapeAttr(f.flag);
      html += `
        <label class="builder-flag ${checked ? 'checked' : ''}" for="flag-${escapeHTML(f.flag.replace(/[^a-zA-Z0-9]/g,''))}">
          <input type="checkbox" id="flag-${escapeHTML(f.flag.replace(/[^a-zA-Z0-9]/g,''))}"
            ${checked ? 'checked' : ''}
            onchange="builderFlagToggle('${esc}', this.checked)"
          />
          <div class="builder-flag-body">
            <div class="builder-flag-name">${escapeHTML(f.flag)}</div>
            <div class="builder-flag-desc">${escapeHTML(f.desc)}</div>
            ${f.valuePrompt ? `
              <div class="builder-flag-value-input">
                <label>${escapeHTML(f.valuePrompt)}</label>
                <input type="text" placeholder="${escapeHTML(f.valueDefault || '')}"
                  value="${escapeHTML(fval)}"
                  oninput="builderFlagValueChange('${esc}', this.value)"
                  onclick="event.stopPropagation()"
                />
              </div>
            ` : ''}
          </div>
        </label>`;
    });
    html += `</div>`;
  }

  body.innerHTML = html;
}

function builderArgChange(key, value) {
  if (!currentBuilder) return;
  currentBuilder.values[key] = value;
  updateBuilderPreview();
}

function builderFlagToggle(flag, checked) {
  if (!currentBuilder) return;
  currentBuilder.flags[flag] = checked;
  // Re-render just the label class without full re-render for performance
  const id = 'flag-' + flag.replace(/[^a-zA-Z0-9]/g, '');
  const el = document.getElementById(id);
  if (el) el.closest('.builder-flag').classList.toggle('checked', checked);
  updateBuilderPreview();
}

function builderFlagValueChange(flag, value) {
  if (!currentBuilder) return;
  currentBuilder.flagValues[flag] = value;
  updateBuilderPreview();
}

function buildCommandString() {
  if (!currentBuilder) return '';
  const { def, values, flags, flagValues } = currentBuilder;

  let parts = [def.base];

  // Args: required positional args that come before flags
  const preArgs = [];
  const postArgs = [];
  (def.args || []).forEach((a, i) => {
    const v = (values[a.key] || '').trim();
    if (!v && a.required === false) return;
    const val = v || (a.placeholder || a.key);
    // Most CLIs have positional args before flags but some after
    if (def.argsAfterFlags) postArgs.push(a.quote ? `"${val}"` : val);
    else preArgs.push(a.quote ? `"${val}"` : val);
  });

  parts = parts.concat(preArgs);

  // Separate filter-mode flags (tcpdump expression) from regular flags
  const regularFlags = [];
  const filterFlags = [];

  (def.flags || []).forEach(f => {
    if (!flags[f.flag] && !f.alwaysOn) return;
    const fval = (flagValues[f.flag] || f.valueDefault || '').trim();
    const flagStr = f.join !== undefined
      ? (fval ? `${f.flag}${f.join}${f.quote ? `"${fval}"` : fval}` : f.flag)
      : f.flag;

    if (f.filterMode) filterFlags.push(flagStr);
    else regularFlags.push(flagStr);
  });

  parts = parts.concat(regularFlags);
  parts = parts.concat(postArgs);

  // Add filter expression if any (tcpdump style — space separated)
  if (filterFlags.length) parts.push(filterFlags.join(' and '));

  return parts.filter(Boolean).join(' ');
}

function updateBuilderPreview() {
  const cmd = buildCommandString();
  const previewEl = document.getElementById('builder-preview-text');
  if (!previewEl) return;

  // Colorize the preview
  const { def } = currentBuilder;
  const baseParts = def.base.split(' ');
  let colored = baseParts.map(p => `<span style="color:var(--accent);font-weight:600">${escapeHTML(p)}</span>`).join(' ');

  // Get everything after the base command
  const afterBase = cmd.slice(def.base.length).trim();
  if (afterBase) {
    const tokens = afterBase.split(' ');
    const coloredTokens = tokens.map(t => {
      if (t.startsWith('-')) return `<span style="color:var(--cyan)">${escapeHTML(t)}</span>`;
      if (t.startsWith('"') || t.startsWith("'")) return `<span style="color:#b8d490">${escapeHTML(t)}</span>`;
      return `<span style="color:var(--text2)">${escapeHTML(t)}</span>`;
    });
    colored += ' ' + coloredTokens.join(' ');
  }

  previewEl.innerHTML = colored || '<span style="color:var(--text3)">Start filling in options above...</span>';
}

function copyBuiltCommand() {
  const cmd = buildCommandString();
  if (!cmd) return;
  const btn = document.querySelector('#builder-modal .btn.primary');
  const orig = btn.textContent;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(cmd).then(() => {
      addToHistory(cmd);
      btn.textContent = '✓ Copied!';
      setTimeout(() => { btn.textContent = orig; }, 1500);
    });
  } else {
    fallbackCopy(cmd);
    addToHistory(cmd);
    btn.textContent = '✓ Copied!';
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }
}



/* ─────────────────────────────────────────
   COPY & HISTORY
───────────────────────────────────────── */
function copyCmd(btn, text) {
  const finalText = text.replace(/\\'/g, "'").replace(/\\\\/g, '\\').replace(/\\n/g, '\n');

  const doCopy = () => {
    btn.textContent = '✓';
    btn.classList.add('ok');
    addToHistory(finalText);
    setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
  };

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(finalText).then(doCopy).catch(() => {
      // Fall back
      fallbackCopy(finalText);
      doCopy();
    });
  } else {
    fallbackCopy(finalText);
    doCopy();
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function addToHistory(cmd) {
  // Remove duplicates
  state.history = state.history.filter(h => h.cmd !== cmd);
  state.history.unshift({ cmd: cmd, time: Date.now() });
  // Keep last 50
  if (state.history.length > 50) state.history = state.history.slice(0, 50);
  save('history');
  updateHistoryBadge();
  if (document.getElementById('history-panel').classList.contains('open')) {
    renderHistory();
  }
}

function updateHistoryBadge() {
  const badge = document.getElementById('history-badge');
  if (state.history.length > 0) {
    badge.style.display = 'block';
    badge.textContent = state.history.length > 99 ? '99+' : state.history.length;
  } else {
    badge.style.display = 'none';
  }
}

function renderHistory() {
  const body = document.getElementById('history-body');
  if (state.history.length === 0) {
    body.innerHTML = '<div class="history-empty">No commands copied yet.<br>Copied commands will appear here.</div>';
    return;
  }

  const formatTime = (ts) => {
    const diff = Date.now() - ts;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    return Math.floor(diff / 86400000) + 'd ago';
  };

  body.innerHTML = state.history.map((h, i) => `
    <div class="history-item" onclick="copyFromHistory(${i})">
      <div class="history-cmd">${escapeHTML(h.cmd)}</div>
      <div class="history-meta">
        <span>${formatTime(h.time)}</span>
        <span>·</span>
        <span>click to copy again</span>
      </div>
    </div>
  `).join('');
}

function copyFromHistory(i) {
  const item = state.history[i];
  if (!item) return;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(item.cmd).catch(() => fallbackCopy(item.cmd));
  } else {
    fallbackCopy(item.cmd);
  }
  // Move to top
  state.history.splice(i, 1);
  state.history.unshift({ ...item, time: Date.now() });
  save('history');
  renderHistory();
}

function clearHistory() {
  if (confirm('Clear all copy history? This cannot be undone.')) {
    state.history = [];
    save('history');
    renderHistory();
    updateHistoryBadge();
  }
}

function togglePanel(name) {
  if (name === 'history') {
    const panel = document.getElementById('history-panel');
    const btn = document.getElementById('history-btn');
    const wasOpen = panel.classList.contains('open');
    panel.classList.toggle('open', !wasOpen);
    if (btn) btn.classList.toggle('active', !wasOpen);
    if (!wasOpen) renderHistory();
  }
}

/* ─────────────────────────────────────────
   SEARCH & KEYBOARD
───────────────────────────────────────── */
document.getElementById('search').addEventListener('input', function() {
  state.searchQuery = this.value.trim();
  renderMain();
});

document.addEventListener('keydown', function(e) {
  // Cmd/Ctrl + K to focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    const s = document.getElementById('search');
    s.focus();
    s.select();
  }
  // Cmd/Ctrl + B to toggle sidebar (on desktop)
  if ((e.ctrlKey || e.metaKey) && e.key === 'b') {
    e.preventDefault();
    const sb = document.getElementById('sidebar');
    sb.style.display = sb.style.display === 'none' ? '' : 'none';
  }
  // Escape closes things
  if (e.key === 'Escape') {
    const builder = document.getElementById('builder-modal');
    if (builder.classList.contains('open')) { closeBuilder(); return; }
    const modal = document.getElementById('note-modal');
    if (modal.classList.contains('open')) { closeModal(); return; }
    const panel = document.getElementById('history-panel');
    if (panel.classList.contains('open')) { togglePanel('history'); return; }
    const s = document.getElementById('search');
    if (document.activeElement === s) {
      s.value = '';
      state.searchQuery = '';
      renderMain();
      s.blur();
    }
  }
  // Cmd/Ctrl + Enter to save note when modal open
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    const modal = document.getElementById('note-modal');
    if (modal.classList.contains('open')) {
      e.preventDefault();
      saveNote();
    }
  }
});

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
// Validate stored state — clear activeSection if it doesn't belong to activeSheet
if (state.activeSection && SHEETS[state.activeSheet]) {
  const validSection = SHEETS[state.activeSheet].sections.some(s => s.id === state.activeSection);
  if (!validSection) {
    state.activeSection = null;
    save('activeSection');
  }
}
// If activeSheet no longer exists in SHEETS, reset
if (!['__favorites','__builder'].includes(state.activeSheet) && !SHEETS[state.activeSheet]) {
  state.activeSheet = 'gam7';
  state.activeSection = null;
  save('activeSheet');
  save('activeSection');
}

/* ─────────────────────────────────────────
   VIEW MODES
───────────────────────────────────────── */
function setView(mode) {
  state.viewMode = mode;
  save('viewMode');
  applyView();
}

function applyView() {
  document.body.setAttribute('data-view', state.viewMode);
  ['comfortable','compact','cards'].forEach(m => {
    const btn = document.getElementById('view-' + m);
    if (btn) btn.classList.toggle('active', m === state.viewMode);
  });
}

/* ─────────────────────────────────────────
   FONT SIZE
───────────────────────────────────────── */
function setFontSize(size) {
  state.fontSize = parseInt(size, 10);
  save('fontSize');
  applyFontSize();
}

function applyFontSize() {
  document.documentElement.style.setProperty('--ui-font-size', state.fontSize + 'px');
  const slider = document.getElementById('font-slider');
  if (slider) slider.value = state.fontSize;
}

/* ─────────────────────────────────────────
   SYNTAX HIGHLIGHTING
───────────────────────────────────────── */
function syntaxHighlight(cmd) {
  // Escape HTML first
  let s = cmd
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Quoted strings (single or double) — do first to avoid re-processing
  s = s.replace(/(&quot;[^&]*&quot;|'[^']*')/g,
    m => `<span class="syn-str">${m}</span>`);

  // Flags: --flag, -f, /FLAG (Windows), +flag
  s = s.replace(/(?<![a-zA-Z])(--?[a-zA-Z][\w-]*|\/[A-Z]+(?::[^\s]*)?|\+[a-zA-Z][\w-]*)/g,
    m => `<span class="syn-flag">${m}</span>`);

  // Paths and files (contains / or \ or .ext)
  s = s.replace(/(?:^|\s)((?:~|\.\.?)?\/[\w./-]+|[\w.-]+\.(?:json|yaml|yml|txt|log|sh|py|js|tf|conf|cfg|ini|pem|key|crt|pfx|csv|xml|md|gz|tar|zip))/g,
    (m, path) => m.replace(path, `<span class="syn-path">${path}</span>`));

  // Pipes, redirects, &&, ||
  s = s.replace(/(\s)(\|{1,2}|&amp;&amp;|\|\||\s&gt;\s|\s&gt;&gt;\s|\s2&gt;)(\s)/g,
    (m, a, op, b) => `${a}<span class="syn-op">${op}</span>${b}`);

  // SQL keywords
  s = s.replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT|RIGHT|INNER|OUTER|ON|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|INSERT INTO|UPDATE|DELETE|CREATE|DROP|ALTER|INDEX|TABLE|AS|AND|OR|NOT|IN|LIKE|IS NULL|IS NOT NULL|COUNT|SUM|AVG|MAX|MIN|DISTINCT|UNION|WITH)\b/gi,
    m => `<span class="syn-kw">${m}</span>`);

  // Numbers (standalone)
  s = s.replace(/(?<![a-zA-Z#-])(\b\d+(?:\.\d+)?\b)(?![a-zA-Z])/g,
    m => `<span class="syn-num">${m}</span>`);

  return s;
}

/* ─────────────────────────────────────────
   SIDEBAR RESIZE
───────────────────────────────────────── */
function initSidebarResize() {
  const resizer = document.getElementById('sidebar-resizer');
  const sidebar = document.getElementById('sidebar');
  if (!resizer || !sidebar) return;

  let dragging = false;
  let startX = 0;
  let startW = 0;

  resizer.addEventListener('mousedown', e => {
    dragging = true;
    startX = e.clientX;
    startW = sidebar.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const newW = Math.max(160, Math.min(400, startW + e.clientX - startX));
    sidebar.style.width = newW + 'px';
    state.sidebarWidth = newW;
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    save('sidebarWidth');
  });
}

function applySidebarWidth() {
  const sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.style.width = state.sidebarWidth + 'px';
}

/* ─────────────────────────────────────────
   INIT
───────────────────────────────────────── */
applyTheme();
applyView();
applyFontSize();
applySidebarWidth();
initSidebarResize();
renderSidebar();
renderMain();
updateHistoryBadge();
</script>
